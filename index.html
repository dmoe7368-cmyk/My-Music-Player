<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="XAMOE Music Player - Local and XAMOE Drive music player">
  <meta name="theme-color" content="#080a12">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="XAMOE Music">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <title>XAMOE Music</title>
</head>

<body>
  <div class="app">

    <aside class="sidebar">
      <div class="brand">🎵 <span>XAMOE Music</span></div>

      <nav>
        <button class="nav-btn active" data-view="local" type="button">💻 Local Music</button>
        <button class="nav-btn" data-view="drive" type="button">☁️ XAMOE Drive</button>
        <button class="nav-btn" data-view="favorites" type="button">❤️ Favorites</button>
      </nav>

      <div class="sidebar-bottom">
        <button id="chooseFilesBtn" class="primary-btn" type="button">＋ Choose MP3 Files</button>
        <button id="clearLocalBtn" class="text-btn" type="button">Clear local playlist</button>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div>
          <h1 id="viewTitle">Local Music</h1>
          <p id="viewSubtitle"></p>
        </div>

        <input
          id="searchInput"
          type="search"
          placeholder="Search songs..."
          aria-label="Search songs"
          autocomplete="off"
        >
      </header>

      <!-- Kept for app.js compatibility; hidden because Drive auto-loads. -->
      <section id="drivePanel" class="drive-panel hidden">
        <div>
          <h2>XAMOE Drive</h2>
          <p id="driveStatus">Loading...</p>
        </div>
        <div class="drive-actions">
          <button id="driveConnectBtn" class="primary-btn" type="button">Load</button>
          <button id="driveRefreshBtn" class="secondary-btn" type="button">Refresh</button>
        </div>
      </section>

      <section class="library">
        <div class="section-head">
          <h2 id="sectionTitle">Songs</h2>
          <span id="songCount">0 songs</span>
        </div>

        <div id="emptyState" class="empty-state">
          <div class="empty-icon">🎧</div>
          <h3>No songs yet</h3>
          <p>Choose MP3 files to start listening.</p>
          <button class="primary-btn" id="emptyChooseBtn" type="button">Choose MP3 Files</button>
        </div>

        <div id="songList" class="song-list"></div>
      </section>
    </main>

    <footer class="player">
      <div class="now-playing">
        <div id="cover" class="cover" aria-hidden="true">♪</div>

        <div class="track-info">
          <strong id="nowTitle">Nothing playing</strong>
          <span id="nowArtist">—</span>
        </div>

        <button id="favoriteBtn" class="icon-btn" type="button" title="Favorite" aria-label="Favorite">♡</button>
      </div>

      <div class="controls">
        <div class="control-buttons">
          <button id="shuffleBtn" class="icon-btn" type="button" title="Shuffle" aria-label="Shuffle" aria-pressed="false">🔀</button>
          <button id="prevBtn" class="icon-btn" type="button" title="Previous" aria-label="Previous song">⏮</button>
          <button id="playBtn" class="play-btn" type="button" title="Play" aria-label="Play">▶</button>
          <button id="nextBtn" class="icon-btn" type="button" title="Next" aria-label="Next song">⏭</button>
          <button id="repeatBtn" class="icon-btn" type="button" title="Repeat" aria-label="Repeat" aria-pressed="false">🔁</button>
        </div>

        <div class="progress-row">
          <span id="currentTime">0:00</span>
          <input id="progress" type="range" min="0" max="100" value="0" step="0.1" aria-label="Song progress">
          <span id="duration">0:00</span>
        </div>
      </div>

      <div class="volume">
        <span>🔊</span>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8" aria-label="Volume">
      </div>
    </footer>
  </div>

  <input id="fileInput" type="file" accept="audio/mpeg,audio/mp3,.mp3" multiple hidden>
  <audio id="audio" preload="metadata"></audio>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/My-Music-Player/sw.js").catch(function (error) {
          console.error("PWA Service Worker error:", error);
        });
      });
    }
  </script>
</body>
</html>
