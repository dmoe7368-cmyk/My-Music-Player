<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="description"
    content="My Music Player - Local and Google Drive MP3 Music Player"
  >

  <meta name="theme-color" content="#0b0d12">

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="My Music"
  >

  <title>My Music Player</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">

</head>


<body>

  <div class="app">


    <!-- =========================================
         SIDEBAR / NAVIGATION
    ========================================== -->

    <aside class="sidebar">

      <div class="brand">
        🎵 <span>My Music</span>
      </div>


      <nav>

        <button
          class="nav-btn active"
          data-view="local"
          type="button"
        >
          💻 Local Music
        </button>


        <button
          class="nav-btn"
          data-view="drive"
          type="button"
        >
          ☁️ Google Drive
        </button>


        <button
          class="nav-btn"
          data-view="favorites"
          type="button"
        >
          ❤️ Favorites
        </button>

      </nav>


      <!-- LOCAL MUSIC ACTIONS -->

      <div class="sidebar-bottom">

        <button
          id="chooseFilesBtn"
          class="primary-btn"
          type="button"
        >
          ＋ Choose MP3 Files
        </button>


        <button
          id="clearLocalBtn"
          class="text-btn"
          type="button"
        >
          Clear local playlist
        </button>

      </div>

    </aside>



    <!-- =========================================
         MAIN CONTENT
    ========================================== -->

    <main class="main">


      <!-- TOP BAR -->

      <header class="topbar">

        <div>

          <h1 id="viewTitle">
            Local Music
          </h1>

          <p id="viewSubtitle">
            Play MP3 files directly from your browser.
          </p>

        </div>


        <!-- SEARCH -->

        <input
          id="searchInput"
          type="search"
          placeholder="Search songs..."
          aria-label="Search songs"
          autocomplete="off"
        >

      </header>



      <!-- =========================================
           GOOGLE DRIVE
      ========================================== -->

      <section
        id="drivePanel"
        class="drive-panel hidden"
      >

        <div>

          <h2>
            Google Drive
          </h2>

          <p id="driveStatus">
            Loading public Google Drive music...
          </p>

        </div>


        <div class="drive-actions">

          <button
            id="driveConnectBtn"
            class="primary-btn"
            type="button"
          >
            Load Drive Music
          </button>


          <button
            id="driveRefreshBtn"
            class="secondary-btn"
            type="button"
          >
            Refresh
          </button>

        </div>

      </section>



      <!-- =========================================
           SONG LIBRARY
      ========================================== -->

      <section class="library">


        <!-- SECTION HEADER -->

        <div class="section-head">

          <h2 id="sectionTitle">
            Songs
          </h2>

          <span id="songCount">
            0 songs
          </span>

        </div>



        <!-- =======================================
             EMPTY STATE
        ======================================== -->

        <div
          id="emptyState"
          class="empty-state"
        >

          <div class="empty-icon">
            🎧
          </div>


          <h3>
            No songs yet
          </h3>


          <p>
            Choose MP3 files to start listening.
          </p>


          <button
            class="primary-btn"
            id="emptyChooseBtn"
            type="button"
          >
            Choose MP3 Files
          </button>

        </div>



        <!-- =======================================
             SONG LIST
        ======================================== -->

        <div
          id="songList"
          class="song-list"
        ></div>

      </section>

    </main>



    <!-- =========================================
         MUSIC PLAYER
    ========================================== -->

    <footer class="player">


      <!-- =======================================
           NOW PLAYING
      ======================================== -->

      <div class="now-playing">


        <div
          id="cover"
          class="cover"
          aria-hidden="true"
        >
          ♪
        </div>


        <div class="track-info">

          <strong id="nowTitle">
            Nothing playing
          </strong>

          <span id="nowArtist">
            —
          </span>

        </div>


        <button
          id="favoriteBtn"
          class="icon-btn"
          type="button"
          title="Favorite"
          aria-label="Favorite"
        >
          ♡
        </button>

      </div>



      <!-- =======================================
           PLAYER CONTROLS
      ======================================== -->

      <div class="controls">


        <div class="control-buttons">


          <!-- SHUFFLE -->

          <button
            id="shuffleBtn"
            class="icon-btn"
            type="button"
            title="Shuffle"
            aria-label="Shuffle"
          >
            🔀
          </button>


          <!-- PREVIOUS -->

          <button
            id="prevBtn"
            class="icon-btn"
            type="button"
            title="Previous"
            aria-label="Previous song"
          >
            ⏮
          </button>


          <!-- PLAY -->

          <button
            id="playBtn"
            class="play-btn"
            type="button"
            title="Play"
            aria-label="Play"
          >
            ▶
          </button>


          <!-- NEXT -->

          <button
            id="nextBtn"
            class="icon-btn"
            type="button"
            title="Next"
            aria-label="Next song"
          >
            ⏭
          </button>


          <!-- REPEAT -->

          <button
            id="repeatBtn"
            class="icon-btn"
            type="button"
            title="Repeat"
            aria-label="Repeat"
          >
            🔁
          </button>

        </div>



        <!-- =====================================
             PROGRESS BAR
        ====================================== -->

        <div class="progress-row">


          <span id="currentTime">
            0:00
          </span>


          <input
            id="progress"
            type="range"
            min="0"
            max="100"
            value="0"
            step="0.1"
            aria-label="Song progress"
          >


          <span id="duration">
            0:00
          </span>

        </div>

      </div>



      <!-- =======================================
           VOLUME
      ======================================== -->

      <div class="volume">

        <span>
          🔊
        </span>


        <input
          id="volume"
          type="range"
          min="0"
          max="1"
          step="0.01"
          value="0.8"
          aria-label="Volume"
        >

      </div>

    </footer>

  </div>



  <!-- =========================================
       HIDDEN FILE INPUT
  ========================================== -->

  <input
    id="fileInput"
    type="file"
    accept="audio/mpeg,audio/mp3,.mp3"
    multiple
    hidden
  >



  <!-- =========================================
       AUDIO ELEMENT
  ========================================== -->

  <audio
    id="audio"
    preload="metadata"
  ></audio>



  <!-- =========================================
       GOOGLE DRIVE CONFIG
  ========================================== -->

  <script src="js/config.js"></script>



  <!-- =========================================
       APP JAVASCRIPT
  ========================================== -->

  <script src="js/app.js"></script>



  <!-- =========================================
       PWA SERVICE WORKER
  ========================================== -->

  <script>

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function () {

        navigator.serviceWorker
          .register("/My-Music-Player/sw.js")
          .then(function () {

            console.log("My Music Player PWA ready");

          })
          .catch(function (error) {

            console.error(
              "PWA Service Worker error:",
              error
            );

          });

      });

    }

  </script>


</body>

</html>
